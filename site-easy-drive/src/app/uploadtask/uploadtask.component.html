<div class="progress-bar" *ngIf="percentage | async as pct">
  <mat-progress-bar mode="determinate" [value]="pct" max="100"></mat-progress-bar>
  <div class="progress-message-cont">
    <div class="progress-message1" ><p>{{ pct | number }}%</p></div>
    <div class="progress-message2" ><p *ngIf="done">Succes!</p></div>
  </div>
</div>

<div *ngIf="snapshot | async as snap">

  <button mat-flat-button (click)="task.pause()" [disabled]="!isActive(snap)">Pause</button>
  <button mat-flat-button (click)="task.cancel()" [disabled]="!isActive(snap)">Cancel</button>
  <button mat-flat-button (click)="task.resume()" [disabled]="!(snap?.state === 'paused')">Resume</button>
</div>
