<div
  class="dropzone"
  appDropzone
  (hovered)="toggleHover($event)"
  (dropped)="onDrop($event)"
  [class.hovering]="isHovering"
>
  <h3>Drag and drop files here</h3>

  <label>
  <mat-card matRipple class="ripple-container mat-elevation-z4">
      or choose a file ...<i class="material-icons"></i>
      <input type="file" (change)="upload($event)" />
    </mat-card>
  </label>
</div>

<h3>Uploads</h3>

<div *ngFor="let file of files">
  <app-uploadtask [file]="file"></app-uploadtask>
</div>
