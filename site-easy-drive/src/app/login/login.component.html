<mat-card class="login-container">
  <div>
    <h2>Login</h2>
    <mat-form-field>
      <input matInput [(ngModel)]="email" placeholder="username" />
    </mat-form-field><br/>
    <mat-form-field>
      <input matInput [(ngModel)]="password" placeholder="password" type="password"/>
    </mat-form-field>
    <div class="loginButtonContainer">
      <button mat-flat-button color="primary" (click)="Login()">Login</button>
    </div>
    {{ message }}
  </div>
  <div><br/>
    <p>Don't have an account</p>
    <button mat-flat-button color="primary" (click)="register()">
      Register
    </button>
  </div>
</mat-card >
