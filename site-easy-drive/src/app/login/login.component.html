<mat-card *ngIf="!register" class="login-container">
  <div class='login-form'>
    <h2>Login</h2>
    <mat-form-field>
      <input matInput [(ngModel)]="email" placeholder="username" />
    </mat-form-field><br/>
    <mat-form-field>
      <input matInput [(ngModel)]="password" placeholder="password" type="password"/>
    </mat-form-field>
    <div class="loginButtonContainer">
      <button mat-flat-button color="primary" (click)="Login()">Login</button>
    </div>
    {{ message }}
  </div>
  <div class='login-register'><br/>
    <p>Don't have an account ?</p>
    <button mat-flat-button color="primary" (click)="registerStart()">
      Register
    </button>
  </div>
</mat-card >

<app-register *ngIf="register"></app-register>
