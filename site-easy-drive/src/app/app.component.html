<mat-toolbar color="primary">
  <span>{{ title }}</span>
  <span class="toolbar-span"></span>
  <button *ngIf="userLoggedIn" mat-button (click)="openUploadModal()" matTooltip="Upload Files">
    <mat-icon>add</mat-icon>
  </button>
  <button *ngIf="userLoggedIn" mat-button (click)="openAccountModal()" matTooltip="Acount">
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>

<mat-drawer-container class="drawer-container" autosize>

  <mat-drawer #drawer class="drawer-sidenav" mode="side" position="end">
    <button mat-button color="white" (click)="drawer.close()" matTooltip="Close details">
      <mat-icon>clear</mat-icon>
    </button>
    <app-singlefile *ngIf="userLoggedIn" [userfile]="clickedFile"></app-singlefile>

  </mat-drawer>

    <app-files *ngIf="userLoggedIn" (fileClicked)="childFileClicked($event)"></app-files>

  <app-login *ngIf="!userLoggedIn"></app-login>

</mat-drawer-container>
