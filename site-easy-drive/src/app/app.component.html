<mat-toolbar color="primary">
  <span>{{ title }}</span>
  <span class="toolbar-span"></span>
  <button mat-button (click)="openUploadModal()" matTooltip="Upload Files">
    <mat-icon>add</mat-icon>
  </button>
  <button  routerLink="/login" mat-button (click)="drawer.close()" matTooltip="Acount">
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>

<mat-drawer-container class="drawer-container" autosize>

  <mat-drawer #drawer class="drawer-sidenav" mode="side" position="end">
    <button mat-button color="white" (click)="drawer.close()" matTooltip="Close details">
      <mat-icon>clear</mat-icon>
    </button>

    <app-singlefile [userfile]="clickedFile"></app-singlefile>
  </mat-drawer>

  <app-login></app-login>

  <app-files (fileClicked)="childFileClicked($event)"></app-files>


</mat-drawer-container>
